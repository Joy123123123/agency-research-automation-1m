name: 🌿 Create All Standard Branches

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to create all branches'
        required: true
        default: 'yes'
  push:
    branches:
      - main
      - "copilot/check-repo-status"

jobs:
  create-branches:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.confirm == 'yes'
    name: Create Standard Git Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create develop branch
        run: |
          if git ls-remote --exit-code --heads origin develop; then
            echo "✅ Branch 'develop' already exists"
          else
            git checkout -b develop
            cat > DEVELOP.md << 'MDEOF'
# DEVELOP Branch — Agency Research Automation

এই ব্রাঞ্চ হলো **ডেভেলপমেন্ট ইন্টিগ্রেশন ব্রাঞ্চ**।

সব `feature/*` ব্রাঞ্চ এখানে merge হবে।

**Workflow:** `feature/* → develop → staging → main`

## Rules
- Never push directly to `main`
- All PRs must target `develop` first
- Tests must pass before merging to `staging`
MDEOF
            git add DEVELOP.md
            git commit -m "chore: initialize develop branch"
            git push origin develop
            git checkout -
            echo "✅ Created 'develop' branch"
          fi

      - name: Create staging branch
        run: |
          if git ls-remote --exit-code --heads origin staging; then
            echo "✅ Branch 'staging' already exists"
          else
            git checkout ${{ github.sha }}
            git checkout -b staging
            cat > STAGING.md << 'MDEOF'
# STAGING Branch — Agency Research Automation

এই ব্রাঞ্চ হলো **প্রি-প্রোডাকশন টেস্টিং ব্রাঞ্চ**।

`develop` থেকে merge আসে। Production-এ যাওয়ার আগে এখানে সব কিছু টেস্ট হয়।

## Rules
- QA/UAT testing happens here
- Must pass all integration tests before merging to `main`
- No direct commits — only merges from `develop`
MDEOF
            git add STAGING.md
            git commit -m "chore: initialize staging branch"
            git push origin staging
            git checkout -
            echo "✅ Created 'staging' branch"
          fi

      - name: Create hotfix branch
        run: |
          if git ls-remote --exit-code --heads origin hotfix; then
            echo "✅ Branch 'hotfix' already exists"
          else
            git checkout ${{ github.sha }}
            git checkout -b hotfix
            cat > HOTFIX.md << 'MDEOF'
# HOTFIX Branch — Agency Research Automation

এই ব্রাঞ্চ হলো **ইমার্জেন্সি প্রোডাকশন ফিক্স ব্রাঞ্চ**।

শুধুমাত্র critical production bugs fix করতে এই branch ব্যবহার করুন।

## Usage
```bash
git checkout hotfix
git checkout -b hotfix/fix-description
# ... make fix ...
git commit -m "fix: description"
# Merge into main AND develop
```

## Rules
- Only for critical bugs in production
- After merging to `main`, also merge into `develop`
- Bump version (e.g., v1.0.1)
MDEOF
            git add HOTFIX.md
            git commit -m "chore: initialize hotfix branch"
            git push origin hotfix
            git checkout -
            echo "✅ Created 'hotfix' branch"
          fi

      - name: Create release/v1.0 branch
        run: |
          if git ls-remote --exit-code --heads origin release/v1.0; then
            echo "✅ Branch 'release/v1.0' already exists"
          else
            git checkout ${{ github.sha }}
            git checkout -b release/v1.0
            cat > RELEASE_NOTES.md << 'MDEOF'
# Release v1.0.0 — Agency Research Automation

name: 🌿 Create All Standard Branches

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to create all branches'
        required: true
        default: 'yes'
  push:
    branches:
      - main

jobs:
  create-branches:
    name: Create Standard Git Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create develop branch
        run: |
          if git ls-remote --exit-code --heads origin develop; then
            echo "✅ Branch 'develop' already exists"
          else
            git checkout -b develop
            echo "# DEVELOP Branch" > DEVELOP.md
            echo "" >> DEVELOP.md
            echo "এই ব্রাঞ্চ হলো **ডেভেলপমেন্ট ইন্টিগ্রেশন ব্রাঞ্চ**।" >> DEVELOP.md
            echo "" >> DEVELOP.md
            echo "সব \`feature/*\` ব্রাঞ্চ এখানে merge হবে।" >> DEVELOP.md
            echo "Workflow: \`feature/* → develop → staging → main\`" >> DEVELOP.md
            git add DEVELOP.md
            git commit -m "chore: initialize develop branch"
            git push origin develop
            git checkout main || git checkout -
            echo "✅ Created 'develop' branch"
          fi

      - name: Create staging branch
        run: |
          if git ls-remote --exit-code --heads origin staging; then
            echo "✅ Branch 'staging' already exists"
          else
            git checkout main || git checkout -f $(git rev-parse HEAD)
            git checkout -b staging
            echo "# STAGING Branch" > STAGING.md
            echo "" >> STAGING.md
            echo "এই ব্রাঞ্চ হলো **প্রি-প্রোডাকশন টেস্টিং ব্রাঞ্চ**।" >> STAGING.md
            echo "" >> STAGING.md
            echo "\`develop\` থেকে merge আসে। Production-এ যাওয়ার আগে এখানে সব কিছু টেস্ট হয়।" >> STAGING.md
            git add STAGING.md
            git commit -m "chore: initialize staging branch"
            git push origin staging
            git checkout main || git checkout -f $(git rev-parse HEAD)
            echo "✅ Created 'staging' branch"
          fi

      - name: Create hotfix branch
        run: |
          if git ls-remote --exit-code --heads origin hotfix; then
            echo "✅ Branch 'hotfix' already exists"
          else
            git checkout main || git checkout -f $(git rev-parse HEAD)
            git checkout -b hotfix
            echo "# HOTFIX Branch" > HOTFIX.md
            echo "" >> HOTFIX.md
            echo "এই ব্রাঞ্চ হলো **ইমার্জেন্সি প্রোডাকশন ফিক্স ব্রাঞ্চ**।" >> HOTFIX.md
            echo "" >> HOTFIX.md
            echo "শুধুমাত্র critical bugs fix করতে এই branch ব্যবহার করুন।" >> HOTFIX.md
            echo "Fix করার পর \`main\` এবং \`develop\` উভয়তে merge করুন।" >> HOTFIX.md
            git add HOTFIX.md
            git commit -m "chore: initialize hotfix branch"
            git push origin hotfix
            git checkout main || git checkout -f $(git rev-parse HEAD)
            echo "✅ Created 'hotfix' branch"
          fi

      - name: Create release/v1.0 branch
        run: |
          if git ls-remote --exit-code --heads origin release/v1.0; then
            echo "✅ Branch 'release/v1.0' already exists"
          else
            git checkout main || git checkout -f $(git rev-parse HEAD)
            git checkout -b release/v1.0
            echo "# Release v1.0.0 — Agency Research Automation" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "**Release Date:** $(date +%Y-%m-%d)" >> RELEASE_NOTES.md
            echo "**Owner:** Md Jamil Islam" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "## What's New in v1.0.0" >> RELEASE_NOTES.md
            echo "- Agency discovery via Google Maps API" >> RELEASE_NOTES.md
            echo "- Contact scraping (email, phone, social)" >> RELEASE_NOTES.md
            echo "- AI-powered email generation (OpenAI + Gemini)" >> RELEASE_NOTES.md
            echo "- Automated outreach via SendGrid" >> RELEASE_NOTES.md
            echo "- Follow-up automation (4-step sequence)" >> RELEASE_NOTES.md
            echo "- Weekly/monthly reports (HTML + CSV)" >> RELEASE_NOTES.md
            echo "- Daily task scheduler" >> RELEASE_NOTES.md
            git add RELEASE_NOTES.md
            git commit -m "chore: initialize release/v1.0 branch"
            git push origin release/v1.0
            git checkout main || git checkout -f $(git rev-parse HEAD)
            echo "✅ Created 'release/v1.0' branch"
          fi

      - name: Summary
        run: |
          echo ""
          echo "🎉 Branch Setup Complete!"
          echo ""
          echo "Branches in repository:"
          git --no-pager branch -a
          echo ""
          echo "Branch Strategy:"
          echo "  main          ← Production (stable)"
          echo "  develop       ← Integration (all features merge here)"
          echo "  staging       ← Pre-production testing"
          echo "  release/v1.0  ← Current release"
          echo "  hotfix        ← Emergency fixes"
          echo "  feature/*     ← New features"
